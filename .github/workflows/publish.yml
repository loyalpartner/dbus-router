name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-artifacts:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: dbus-router-${{ matrix.target }}
          path: target/release/dbus-router

  upload-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Rename binaries
        run: |
          mv dbus-router-x86_64-unknown-linux-gnu/dbus-router dbus-router-x86_64-linux
          mv dbus-router-aarch64-unknown-linux-gnu/dbus-router dbus-router-aarch64-linux
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            dbus-router-x86_64-linux \
            dbus-router-aarch64-linux \
            --clobber

  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --package dbus-router
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
